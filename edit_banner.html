<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: transparent;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 1200px;
      height: 1100px;
      background: transparent;
    }
    #bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 1200px;
      height: 1100px;
    }
    /* Clean backdrop over original text */
    #patch {
      position: absolute;
      left: 650px;
      top: 120px;
      width: 520px;
      height: 170px;
      /* Subtle horizontal gradient matching the original card */
      background: linear-gradient(90deg, rgba(236,242,251,0.92) 0%, rgba(229,239,252,0.85) 50%, rgba(223,235,253,0.7) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .brand-title {
      font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 44px;
      color: #17213C;
      letter-spacing: -0.5px;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .brand-subtitle {
      font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
      font-size: 21px;
      color: #111827;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="bg-img" src="public/images/micron-home-orig.webp" alt="Original" />
    <div id="patch">
      <div class="brand-title">MicronInfiTech</div>
      <div class="brand-subtitle">
        <div>Join MicronInfiTech Courses</div>
        <div>Learn better, Get Placed Better</div>
      </div>
    </div>
  </div>
</body>
</html>
